name: Deploy

# Deploys run through the Vercel CLI with the project owner's token, so they do not
# depend on who authored the commit. Vercel's own Git deployments are disabled in
# vercel.json to avoid duplicate builds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Pull requests from forks never receive secrets, so only pushes and same-repo
    # pull requests are deployed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      VERCEL_PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: npm install --global vercel@65.14.0

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$VERCEL_ENV"

      - name: Build
        run: vercel build $VERCEL_PROD_FLAG

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $VERCEL_PROD_FLAG)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
